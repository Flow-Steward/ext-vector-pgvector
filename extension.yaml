{
  "manifest_version": 2,
  "extension_id": "flowsteward.pgvector",
  "kind": "tool_provider",
  "version": "1.0.0",
  "release_stage": "active",
  "display_name": "pgvector",
  "description": "Bounded dense-vector storage, document chunks and similarity search through PostgreSQL pgvector and a minimal Google MCP Toolbox build.",
  "lifecycle": {
    "data_schema_version": 1,
    "data_migrations": []
  },
  "vendor": {
    "name": "Flow Steward"
  },
  "listing": {
    "category": "data",
    "tags": [
      "postgres",
      "pgvector",
      "vector",
      "toolbox"
    ],
    "summary": "Dense vector lifecycle, document chunks and bounded similarity search."
  },
  "features": [
    "tool",
    "action"
  ],
  "required_scopes": [
    "extension:invoke"
  ],
  "egress": {
    "connection_fields": [
      "pgvector.host"
    ]
  },
  "account_scope": {
    "scope_type": "project",
    "description": "Explicit project PostgreSQL pgvector connections."
  },
  "entrypoint": {
    "mode": "subprocess",
    "command": [
      "python3",
      "main.py"
    ],
    "timeout_seconds": 40
  },
  "health": {
    "command": [
      "python3",
      "health.py"
    ],
    "timeout_seconds": 5
  },
  "ui_manifest": "ui/ui_manifest.yaml",
  "action_manifest": "ui/actions/actions.yaml",
  "python_requirements": [],
  "runtime": {
    "contract_version": "extension_host_v2",
    "compatibility": {
      "platform_min": "1.4.0"
    },
    "extension_contract_v2": {
      "connection_types": "contracts/connection_types.yaml",
      "operation_manifest": "contracts/operation_manifest.yaml",
      "step_ui_manifest": "contracts/step_ui_manifest.yaml"
    }
  },
  "external_effects": [
    {
      "operation_id": "delete_chunk",
      "effect_kind": "database_write",
      "channel": "pgvector",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "delete_document",
      "effect_kind": "database_write",
      "channel": "pgvector",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "drop_collection",
      "effect_kind": "database_write",
      "channel": "pgvector",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "ensure_collection",
      "effect_kind": "database_write",
      "channel": "pgvector",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "update_chunk",
      "effect_kind": "database_write",
      "channel": "pgvector",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "upsert_chunk",
      "effect_kind": "database_write",
      "channel": "pgvector",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    },
    {
      "operation_id": "upsert_document",
      "effect_kind": "database_write",
      "channel": "pgvector",
      "idempotency": "required",
      "test_mode_behavior": "suppress"
    }
  ],
  "machine_auth": {
    "service_account_key": "svc_ext_pgvector",
    "required_scopes": [
      "extension:invoke"
    ]
  }
}
