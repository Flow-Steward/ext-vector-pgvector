{
  "connection_types": [
    {
      "connection_type_id": "pgvector",
      "display_name": "PostgreSQL pgvector",
      "description": "PostgreSQL database with pgvector installed in public. Public endpoints require verified TLS; private endpoints require host administrator opt-in.",
      "config_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "host"
        ],
        "properties": {
          "host": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253,
            "title": "Server hostname or IP"
          },
          "port": {
            "type": "integer",
            "minimum": 1,
            "maximum": 65535,
            "default": 5432
          },
          "tls": {
            "type": "boolean",
            "default": true
          },
          "database": {
            "type": "string",
            "minLength": 1,
            "maxLength": 63,
            "default": "postgres"
          },
          "request_timeout_seconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 30,
            "default": 15
          },
          "schema": {
            "type": "string",
            "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,62}$",
            "minLength": 1,
            "maxLength": 63,
            "default": "fs_vectors"
          }
        }
      },
      "secret_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192,
            "title": "Username"
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 8192,
            "title": "Password"
          }
        }
      },
      "capabilities": {
        "test_connection": false,
        "live_request": true,
        "workflow_trigger": false,
        "callback_ingress": false
      },
      "safety_profile": {
        "requires_https": false,
        "requires_host_allowlist": true,
        "stores_secret_values": false
      }
    }
  ]
}
