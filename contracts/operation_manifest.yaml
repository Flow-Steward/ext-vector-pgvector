{
  "operations": [
    {
      "operation_id": "ensure_collection",
      "display_name": "Ensure Collection",
      "description": "Create schema, dimensioned chunk table and HNSW index; verify existing dimension and metric. pgvector must already be installed in public.",
      "operation_kind": "action",
      "workflow_visible": true,
      "connection_type_ids": [
        "pgvector"
      ],
      "category": "data",
      "inputs": [
        {
          "name": "connection_ref",
          "value_type": "connection_ref",
          "required": true,
          "display_name": "Connection"
        },
        {
          "name": "collection",
          "value_type": "text",
          "required": true,
          "display_name": "Collection",
          "schema": {
            "type": "string",
            "pattern": "^[A-Za-z_][A-Za-z0-9_]{0,47}$",
            "minLength": 1,
            "maxLength": 48
          }
        },
        {
          "name": "dimensions",
          "value_type": "integer",
          "required": true,
          "display_name": "Dimensions",
          "schema": {
            "type": "integer",
            "minimum": 1,
            "maximum": 2000
          }
        },
        {
          "name": "metric",
          "value_type": "text",
          "required": false,
          "display_name": "Metric",
          "schema": {
            "type": "string",
            "enum": [
              "cosine",
              "l2",
              "inner_product"
            ],
            "default": "cosine"
          }
        }
      ],
      "outputs": [
        {
          "name": "records",
          "value_type": "json"
        },
        {
          "name": "count",
          "value_type": "integer"
        },
        {
          "name": "applied",
          "value_type": "boolean"
        }
      ],
      "result_fields": [
        "result.records",
        "result.count",
        "result.applied"
      ],
      "error_codes": [
        "invalid_payload",
        "invalid_connection",
        "effect_claim_required",
        "test_mode_suppressed",
        "provider_unavailable",
        "native_unavailable",
        "invalid_provider_response",
        "response_too_large",
        "network_blocked",
        "timeout",
        "authentication_failed",
        "index_configuration_mismatch",
        "invalid_vector"
      ]
    },
